# Example model catalogue — copy and edit this file to match your setup.
# Local Ollama models need no API key. Eight curated OpenRouter models share
# OPENROUTER_API_KEY. Direct OpenAI and Anthropic models can be added manually.
# Runtime overlays override entries here by catalogue id.
# role: candidate (answers prompts), judge (scores answers) or both.
# Note: reasoning models (supports_reasoning: true, e.g. Qwen3) make unreliable judges —
# they tend to spend their whole token budget "thinking" and never emit the rubric JSON.
# Prefer a non-reasoning model (e.g. Llama 3.2 3B) as the judge; the UI defaults to one.

models:

  # --- Local (Ollama) ---------------------------------------------------------
  - id: qwen3-4b
    display_name: "Qwen3 4B (local)"
    provider: openai_compat
    model_id: qwen3:4b
    base_url: http://localhost:11434/v1
    role: both
    supports_reasoning: true

  - id: llama3-2-3b
    display_name: "Llama 3.2 3B (local)"
    provider: openai_compat
    model_id: llama3.2:3b
    base_url: http://localhost:11434/v1
    role: both
    supports_reasoning: false

  - id: qwen25-coder-7b
    display_name: "Qwen2.5 Coder 7B (local)"
    provider: openai_compat
    model_id: qwen2.5-coder:7b
    base_url: http://localhost:11434/v1
    role: both
    supports_reasoning: false

  # --- OpenRouter (one shared OPENROUTER_API_KEY) ----------------------------
  # Explicit model IDs are used; OpenRouter may route each request to different
  # upstream providers. Reasoning support exposes the optional effort control only.
  - id: openrouter-gpt-6-1-sol
    display_name: "GPT-6.1 Sol (OpenRouter)"
    provider: openai_compat
    model_id: openai/gpt-6.1-sol
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    role: both
    supports_reasoning: true

  - id: openrouter-gpt-6-1-terra
    display_name: "GPT-6.1 Terra (OpenRouter)"
    provider: openai_compat
    model_id: openai/gpt-6.1-terra
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    role: both
    supports_reasoning: true

  - id: openrouter-gpt-6-luna
    display_name: "GPT-6 Luna (OpenRouter)"
    provider: openai_compat
    model_id: openai/gpt-6-luna
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    role: both
    supports_reasoning: true

  - id: openrouter-claude-sonnet-5-5
    display_name: "Claude Sonnet 5.5 (OpenRouter)"
    provider: openai_compat
    model_id: anthropic/claude-sonnet-5.5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    role: both
    supports_reasoning: true

  - id: openrouter-claude-haiku-5-5
    display_name: "Claude Haiku 5.5 (OpenRouter)"
    provider: openai_compat
    model_id: anthropic/claude-haiku-5.5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    role: both
    supports_reasoning: true

  - id: openrouter-claude-opus-5-5
    display_name: "Claude Opus 5.5 (OpenRouter)"
    provider: openai_compat
    model_id: anthropic/claude-opus-5.5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    role: both
    supports_reasoning: true

  - id: openrouter-deepseek-v4-1-flash-1017
    display_name: "DeepSeek V4.1 Flash 1017 (OpenRouter)"
    provider: openai_compat
    model_id: deepseek/deepseek-v4.1-flash-1017
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    role: both
    supports_reasoning: true

  - id: openrouter-qwen3-8-max-0902
    display_name: "Qwen3.8 Max 0902 (OpenRouter)"
    provider: openai_compat
    model_id: qwen/qwen3.8-max-0902
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    role: both
    supports_reasoning: true

  # --- Google Gemini (OpenAI-compatible endpoint) -----------------------------
  # Gemini exposes an OpenAI-compatible API, so it uses the openai_compat type with
  # Google's base_url and a GEMINI_API_KEY. Any provider with an OpenAI-compatible
  # endpoint (Mistral, Groq, Together, Azure OpenAI, ...) follows the same pattern:
  # set base_url + api_key_env. Uncomment and set the key to use it.
